<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>San3a Tech Individual TWIGs Progress</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --accent: #10b981;
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text-dark: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --shadow-light: rgba(0, 0, 0, 0.05);
      --shadow-dark: rgba(0, 0, 0, 0.12);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      margin: 0;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 1.5rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      box-shadow: 0 6px 12px var(--shadow-dark);
      letter-spacing: 0.5px;
      position: relative;
    }

    .nav-buttons {
      position: absolute;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
    }

    .nav-button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
    }

    #company-progress {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 0.5rem;
      color: #d1fae5;
    }

    .dashboard-container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Team dropdown area */
    .team-filters {
      max-width: 1000px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .team-select {
      background: white;
      border: 1px solid var(--border);
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      font-size: 0.95rem;
      min-width: 200px;
    }

    .team-section {
      color: var(--text-dark);
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary-light);
      font-size: 1.5rem;
      font-weight: 600;
    }

    .team-card {
      background: var(--card-bg);
      border-radius: 16px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      box-shadow: 0 8px 16px var(--shadow-light), 0 2px 4px var(--shadow-dark);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .team-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px var(--shadow-light), 0 4px 8px var(--shadow-dark);
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9fafc;
      padding: 1.2rem 1.5rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s ease;
    }

    .team-header:hover {
      background: #f3f4f7;
    }

    .team-name {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .team-progress {
      font-size: 1rem;
      font-weight: 500;
      color: var(--accent);
      background: #d1fae5;
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      transition: transform 0.2s ease;
    }

    .toggle-icon {
      transition: transform 0.3s ease, color 0.3s ease;
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .team-card.open .toggle-icon {
      transform: rotate(90deg);
      color: var(--primary);
    }

    .chart-area {
      padding: 1.5rem 2rem 2rem;
      display: none;
      background: linear-gradient(180deg, #ffffff 0%, #f9fafc 100%);
    }

    .team-card.open .chart-area {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .legend {
      display: flex;
      gap: 1.5rem;
      font-size: 1rem;
      margin-top: 1rem;
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 3rem 0 4rem;
    }

    .tooltip {
      position: absolute;
      background: white;
      border-radius: 12px;
      padding: 0.6rem 1rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      font-size: 0.95rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: 400px;
      white-space: pre-wrap;
    }

    svg rect {
      rx: 6;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-buttons">
      <a href="index.html" class="nav-button">← Team WIGs</a>
    </div>
    San3a Tech Individual TWIGs Progress
    <div id="company-progress">Loading overall progress...</div>
  </header>

  <!-- Team dropdowns will be inserted here -->
  <div class="team-filters" id="team-filters" aria-label="Team filters"></div>

  <div class="dashboard-container" id="dashboard"></div>
  <footer>Data loaded directly from Individual Progress Sheet</footer>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAlZLAJlBAF-_aPbJwDhrlAAjE2tg30nrJn3fUBfNYym9nmc3dFR5mgTSrr7GTxpd0PMNQXlPPqssB/pub?gid=466066634&single=true&output=csv";
    const tooltip = d3.select("#tooltip");
    const companyProgressDiv = d3.select("#company-progress");

    d3.csv(csvUrl).then(rawData => {
      // Extract team names and member names from the first two rows
      const teamNames = Object.entries(rawData[0]).reduce((acc, [key, value]) => {
        if (value && value !== 'WIGs' && key !== '') {
          acc[key] = value;
        }
        return acc;
      }, {});

      const memberNames = rawData[1];
      const processedData = [];
      
      // Compute teams and member counts from the first two rows
      function computeTeams(raw) {
        const headerRow = raw[0];
        const memberRow = raw[1];
        const cols = Object.keys(memberRow);
        const teams = [];

        // find indices where headerRow has a team name (non-empty and not 'WIGs')
        const headerIndices = [];
        cols.forEach((col, idx) => {
          const h = headerRow[col];
          if (h && h.trim() && h.trim() !== 'WIGs') headerIndices.push({ col, idx, name: h.trim() });
        });

        // For each header index, count consecutive member cells until next header index
        for (let i = 0; i < headerIndices.length; i++) {
          const startIdx = headerIndices[i].idx + 1; // members start after header column
          const endIdx = (i + 1 < headerIndices.length) ? headerIndices[i + 1].idx - 1 : cols.length - 1;
          let count = 0;
          for (let j = startIdx; j <= endIdx; j++) {
            const colKey = cols[j];
            if (!colKey) continue;
            const name = memberRow[colKey];
            if (name && String(name).trim()) count++;
          }
          teams.push({ name: headerIndices[i].name, count });
        }

        return teams;
      }

      const teamsMeta = computeTeams(rawData);

      // Render blank dropdowns for each team showing name and member count
      const filtersContainer = d3.select('#team-filters');
      filtersContainer.selectAll('*').remove();
      teamsMeta.forEach(t => {
        const select = filtersContainer.append('select')
          .attr('class', 'team-select')
          .attr('data-team', t.name);
        // placeholder option showing team name and count
        select.append('option').text(`${t.name} — ${t.count} member${t.count === 1 ? '' : 's'}`);
      });
      
      // Process each column (team member)
      Object.keys(memberNames).forEach(colName => {
        if (colName === '' || memberNames[colName] === '') return;
        
        const memberName = memberNames[colName];
        const memberWigs = [];
        
        // Process each WIG (up to 9) for this member
        for (let i = 1; i <= 9; i++) {
          const wigStartRow = (i - 1) * 4 + 2; // WIG description starts at row 2, then every 4 rows
          const wigData = {
            name: memberName,
            teamName: teamNames[colName] || 'Unknown Team',
            wigNumber: i,
            description: rawData[wigStartRow][colName],
            target: parseFloat(rawData[wigStartRow + 1][colName]) || 0,
            achieved: parseFloat(rawData[wigStartRow + 2][colName]) || 0
          };
          
          // Only include WIGs that have both a description and a target
          if (wigData.description && wigData.target > 0) {
            memberWigs.push({
              team: memberName,
              teamName: wigData.teamName,
              wig: wigData.description,
              target: wigData.target,
              actual: wigData.achieved,
              wigNumber: wigData.wigNumber
            });
          }
        }
        
        if (memberWigs.length > 0) {
          processedData.push(...memberWigs);
        }
      });

      drawDashboard(processedData);
    });

    function drawDashboard(data) {
      // Group data by team name first
      const teamGroups = d3.groups(data, d => d.teamName);
      const dashboard = d3.select("#dashboard");

      const allAverages = [];

      // Sort teams alphabetically
      teamGroups.sort((a, b) => a[0].localeCompare(b[0]));

      teamGroups.forEach(([teamName, teamData]) => {
        // Create a team section header
        dashboard.append("h2")
          .attr("class", "team-section")
          .text(teamName);

        // Group team data by individual
        const individuals = d3.groups(teamData, d => d.team);
        
        // Sort individuals alphabetically within each team
        individuals.sort((a, b) => a[0].localeCompare(b[0]));

        individuals.forEach(([name, individualData]) => {
          const normalizedProgress = individualData.map(d => {
            const pct = d.target > 0 ? (d.actual / d.target) * 100 : 0;
            return Math.min(pct, 100);
          });
          const overall = Math.round(d3.mean(normalizedProgress));
          allAverages.push(overall);

          // Sort WIGs by their number
          individualData.sort((a, b) => a.wigNumber - b.wigNumber);
          individualData.forEach(d => d.shortLabel = `WIG #${d.wigNumber}`);

          const card = dashboard.append("div").attr("class", "team-card");
          const header = card.append("div").attr("class", "team-header")
            .on("click", () => card.classed("open", !card.classed("open")));

          const leftHeader = header.append("div")
            .style("display", "flex")
            .style("gap", "0.8rem")
            .style("align-items", "center");

          leftHeader.append("div").attr("class", "team-name").text(name);
          leftHeader.append("div").attr("class", "team-progress").text(`${overall}%`);
          header.append("div").attr("class", "toggle-icon").html("▶");

          const chartArea = card.append("div").attr("class", "chart-area");
          const svg = chartArea.append("svg")
            .attr("viewBox", [0, 0, 850, individualData.length * 55 + 50]);
          drawIndividualChart(svg, individualData);

          const legend = chartArea.append("div").attr("class", "legend");
          legend.html(`
            <div class="legend-item"><div class="legend-color" style="background:var(--primary)"></div> Actual Progress</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--primary-light)"></div> Remaining to Target</div>
          `);
        });
      });

      // Calculate and display overall average
      const overallAverage = Math.round(d3.mean(allAverages));
      companyProgressDiv.text(`Overall Individual Achievement: ${overallAverage}%`);
    }

    function drawIndividualChart(svg, data) {
      const margin = { top: 20, right: 80, bottom: 20, left: 180 };
      const width = 800 - margin.left - margin.right;
      const height = data.length * 45;

      data.forEach(d => {
        d.progress = d.target ? (d.actual / d.target) * 100 : 0;
        d.progress = Math.min(d.progress, 100);
      });

      const x = d3.scaleLinear().domain([0, 100]).range([margin.left, width + margin.left]);
      const y = d3.scaleBand().domain(data.map(d => d.shortLabel)).range([margin.top, height]).padding(0.25);

      svg.selectAll(".target-bar")
        .data(data)
        .join("rect")
        .attr("x", x(0))
        .attr("y", d => y(d.shortLabel))
        .attr("width", x(100) - x(0))
        .attr("height", y.bandwidth())
        .attr("fill", "var(--primary-light)");

      svg.selectAll(".actual-bar")
        .data(data)
        .join("rect")
        .attr("x", x(0))
        .attr("y", d => y(d.shortLabel))
        .attr("width", 0)
        .attr("height", y.bandwidth())
        .attr("fill", "var(--primary)")
        .on("mousemove", (event, d) => showTooltip(event, `${d.wig}\n\nTarget: ${d.target}\nAchieved: ${d.actual}\nProgress: ${Math.round(d.progress)}%`))
        .on("mouseleave", hideTooltip)
        .transition()
        .duration(800)
        .ease(d3.easeCubicOut)
        .attr("width", d => x(d.progress) - x(0));

      svg.selectAll(".bar-label")
        .data(data)
        .join("text")
        .attr("x", d => x(d.progress) + 8)
        .attr("y", d => y(d.shortLabel) + y.bandwidth() / 1.7)
        .attr("fill", "var(--text-dark)")
        .attr("font-size", "14px")
        .attr("font-weight", "500")
        .text(d => `${Math.round(d.progress)}%`);

      const yAxis = svg.append("g")
        .attr("transform", `translate(${margin.left - 10},0)`)
        .call(d3.axisLeft(y).tickSize(0))
        .call(g => g.select(".domain").remove());

      yAxis.selectAll(".tick text")
        .attr("font-size", "14px")
        .on("mousemove", (event, shortLabel) => {
          const item = data.find(d => d.shortLabel === shortLabel);
          showTooltip(event, item ? item.wig : shortLabel);
        })
        .on("mouseleave", hideTooltip);

      svg.append("g")
        .attr("transform", `translate(0,${margin.top})`)
        .call(d3.axisTop(x).ticks(5).tickFormat(d => d + "%"))
        .call(g => g.select(".domain").remove())
        .selectAll("text")
        .attr("font-size", "13px");
    }

    function showTooltip(event, html) {
      tooltip.html(html)
        .style("left", (event.pageX + 12) + "px")
        .style("top", (event.pageY - 28) + "px")
        .style("opacity", 1)
        .style("transform", "translateY(-4px)");
    }

    function hideTooltip() {
      tooltip.style("opacity", 0).style("transform", "translateY(0)");
    }
  </script>
</body>
</html>
